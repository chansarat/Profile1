<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Meet Sarat, a KIC student who enjoys music and travelling.">
    <meta name="theme-color" content="#e6f4ff">
    <title>Meet Sarat</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #23304a;
        background: #e6f4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #e6f4ff;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #e7eaf4;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(35 48 74 / 12%);
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 14px;
        padding: 8px 13px;
        border-radius: 999px;
        background: #fff0dc;
        color: #9b5514;
        font-size: 0.9rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        color: #283d78;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .intro {
        margin: 20px 0 32px;
        color: #526078;
        font-size: 1.15rem;
        line-height: 1.7;
      }

      h2 {
        margin: 0 0 14px;
        color: #283d78;
        font-size: 1.1rem;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        padding: 10px 15px;
        border-radius: 999px;
        background: #e9f4ff;
        color: #315b83;
        font-weight: 700;
      }

      .travel-section {
        margin-top: 30px;
      }

      .travel-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 14px;
      }

      .travel-gallery figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #d5e8f7;
        border-radius: 18px;
        background: #f7fbff;
      }

      .travel-gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .travel-gallery figcaption {
        padding: 11px 13px;
        color: #526078;
        font-size: 0.9rem;
      }

      .welcome {
        margin: 32px 0 0;
        padding-top: 20px;
        border-top: 1px solid #e7eaf4;
        color: #6a5689;
        font-weight: 700;
      }

      .message-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e7eaf4;
      }

      .message-form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #283d78;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd3e3;
        border-radius: 12px;
        color: #23304a;
        font: inherit;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #526fc0;
        outline: 3px solid #526fc033;
      }

      button {
        justify-self: start;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #3857a4;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .form-status {
        min-height: 1.5em;
        margin: 0;
        color: #526078;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little about me</p>
      <h1>Hi, I’m Sarat!</h1>
      <p class="intro">I’m a KIC student. I enjoy listening to music and travelling.</p>

      <section aria-labelledby="interests-heading">
        <h2 id="interests-heading">Things I enjoy</h2>
        <ul>
          <li>🎵 Listening to music</li>
          <li>✈️ Travelling</li>
        </ul>
      </section>

      <section class="travel-section" aria-labelledby="travel-heading">
        <h2 id="travel-heading">Travel memories</h2>
        <div class="travel-gallery">
          <figure>
            <img
              src="images/travel-photo.png"
              alt="A lake beside forested hills covered in winter snow"
              width="1024"
              height="768"
            >
            <figcaption>A winter landscape by the water</figcaption>
          </figure>
        </div>
      </section>

      <p class="welcome">Nice to meet you!</p>

      <section class="message-section" aria-labelledby="message-heading">
        <h2 id="message-heading">Send me a message</h2>
        <form
          class="message-form"
          id="message-form"
          method="post"
          action="https://profile1-message-server.onrender.com/messages"
        >
          <label for="sender-name">
            Your name
            <input id="sender-name" name="name" type="text" maxlength="80" autocomplete="name" required>
          </label>
          <label for="sender-message">
            Your message
            <textarea id="sender-message" name="message" maxlength="2000" required></textarea>
          </label>
          <button type="submit">Send message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      const messageForm = document.querySelector("#message-form");
      const formStatus = document.querySelector("#form-status");
      const submitButton = messageForm.querySelector("button[type='submit']");
      const messageApiUrl = "https://profile1-message-server.onrender.com/messages";

      messageForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        submitButton.disabled = true;
        formStatus.textContent = "Sending your message...";

        try {
          const response = await fetch(messageApiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: messageForm.elements.name.value,
              message: messageForm.elements.message.value
            })
          });
          const result = await response.json();

          if (!response.ok) {
            formStatus.textContent = result.error || "Your message could not be sent.";
            return;
          }

          messageForm.reset();
          formStatus.textContent = result.message;
        } catch (error) {
          console.error("Could not send the message.", error);
          formStatus.textContent = "Could not reach the message server. Please try again.";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
